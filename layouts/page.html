{{ define "main" }}
<article class="content{{ if .Params.compact }} compact{{ end }}">
  <header class="page-head">
    {{ partial "crumbs.html" . }}
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "posts" }}<p class="date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time></p>{{ end }}
  </header>
  <div class="body">{{ .Content }}</div>
</article>
{{ end }}
