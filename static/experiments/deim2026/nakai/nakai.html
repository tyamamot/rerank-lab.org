<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イヤホン比較表</title>
<style>
    /* ベーススタイル */
    :root {
        --primary-bg: #f4f7f6;
        --card-bg: #fff;
        --text-main: #333;
        --pos-color: #0056b3;
        --pos-bg: #e3f2fd;
        --neg-color: #d32f2f;
        --neg-bg: #ffebee;
        --border-color: #eee;
        --tooltip-bg: #333;
        --tooltip-text: #fff;
    }

    body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: var(--primary-bg); color: var(--text-main); margin: 0; padding: 20px; }

    /* コントロールパネル */
    .controls {
        background: var(--card-bg); padding: 15px 20px; border-radius: 8px; 
        box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 25px; position: sticky; top: 0; z-index: 100;
        display: flex; flex-wrap: wrap; gap: 20px; align-items: center; border-bottom: 1px solid #ddd;
    }
    .btn-group { display: flex; gap: 5px; }
    button { padding: 8px 16px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; font-weight: bold; transition: all 0.2s; }
    button:hover { background: #f0f0f0; }
    button.active-all { background: #333; color: #fff; border-color: #333; }
    button.active-p { background: var(--pos-color); color: #fff; border-color: var(--pos-color); }
    button.active-n { background: var(--neg-color); color: #fff; border-color: var(--neg-color); }
    select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }

    /* カードレイアウト */
    .aspect-card { background: var(--card-bg); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; overflow: visible; }
    .aspect-header { background: #2c3e50; color: #fff; padding: 12px 20px; font-weight: bold; font-size: 1.2em; display: flex; justify-content: space-between; }
    
    /* 比較テーブル（特有要約用） */
    .comparison-cols { display: flex; width: 100%; border-bottom: 1px solid var(--border-color); }
    .col { flex: 1; padding: 15px; border-right: 1px solid var(--border-color); }
    .col:last-child { border-right: none; }
    .prod-title { text-align: center; font-weight: bold; margin-bottom: 15px; padding-bottom: 5px; border-bottom: 2px solid var(--border-color); color: #777; font-size: 0.9em; }

    /* アイテム（要約）共通スタイル */
    .item { margin-bottom: 10px; font-size: 0.95em; line-height: 1.5; padding: 8px; border-radius: 4px; transition: background 0.2s; }
    .item:hover { background-color: #fafafa; }

    /* ポジネガ装飾 */
    .item.pos .summary-text::before { content: "〇 "; font-weight: bold; }
    .item.neg .summary-text::before { content: "× "; font-weight: bold; }
    .item.pos .summary-text { color: var(--pos-color); font-weight: bold; }
    .item.neg .summary-text { color: var(--neg-color); font-weight: bold; }

    /* 共通要約ブロック */
    .common-block { border-bottom: 2px dashed var(--border-color); padding: 15px; background-color: #fffcf5; }
    .common-summary-wrapper { text-align: center; }
    .common-badge { background: #f0ad4e; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75em; margin-right: 5px; vertical-align: middle; }
    .common-summary-text { font-size: 1.1em; font-weight: bold; color: #444; }

    /* 件数バッジ */
    .count-badge {
        display: inline-block; 
        font-size: 0.8em; 
        padding: 2px 10px; 
        border-radius: 12px;
        background: #eee; 
        color: #555; 
        cursor: pointer; 
        margin-left: 10px; 
        user-select: none; 
        border: 1px solid #ccc;
        transition: background 0.2s, color 0.2s;
    }
    .count-badge:hover { background: #ddd; }

    /* 親要素がポジティブ (.pos) の場合のバッジ色 */
    .item.pos .count-badge { 
        background: #e3f2fd; 
        color: #0056b3; 
        border-color: #bbdefb;
    }
    .item.pos .count-badge:hover { 
        background: #bbdefb; 
    }

    /* 親要素がネガティブ (.neg) の場合のバッジ色 */
    .item.neg .count-badge { 
        background: #ffebee; 
        color: #d32f2f; 
        border-color: #ffcdd2;
    }
    .item.neg .count-badge:hover { 
        background: #ffcdd2; 
    }

    /* 展開エリア（評価文リスト） */
    .details-panel { display: none; margin-top: 10px; border-top: 1px solid #ddd; padding-top: 10px; animation: fadeIn 0.3s; }
    .details-split { display: flex; gap: 20px; } 
    .details-col { flex: 1; }
    .details-col-title { font-size: 0.8em; color: #999; margin-bottom: 5px; text-align: center; border-bottom: 1px solid #eee; }

    /* ★変更箇所：リストスタイルを箇条書き（黒丸）に変更★ */
    .evidence-list { 
        margin: 0; 
        padding-left: 20px; /* 黒丸分のインデント */
        list-style-type: disc; /* 黒丸を表示 */
    }
    
    /* ★変更箇所：個別の評価文のデザインをシンプルに変更★ */
    .evidence-item { 
        margin-bottom: 6px; 
        font-size: 0.9em; 
        color: #555; 
        cursor: help; 
        position: relative; 
        /* 左線とパディングを削除 */
        padding: 0; 
        border-left: none;
    }
    .evidence-item:hover { 
        background: #ffffdd; 
        color: #000;
        /* ボーダー色の変更も削除 */
    }

    /* ツールチップ（吹き出し） */
    .tooltip {
        visibility: hidden; position: absolute; z-index: 1000;
        bottom: 100%; left: 0; min-width: 300px; max-width: 500px; width: max-content;
        background-color: var(--tooltip-bg); color: var(--tooltip-text);
        text-align: left; padding: 10px; border-radius: 6px;
        font-size: 0.85em; line-height: 1.4;
        opacity: 0; transition: opacity 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .tooltip::after {
        content: ""; position: absolute; top: 100%; left: 20px;
        margin-left: -5px; border-width: 5px; border-style: solid;
        border-color: var(--tooltip-bg) transparent transparent transparent;
    }
    .evidence-item:hover .tooltip { visibility: visible; opacity: 1; }
    
    /* フィルタ非表示用 */
    .hidden-item { display: none !important; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    .show { display: block; }
</style>
</head>
<body>

<div class="controls">
    <div>
        <strong>観点フィルタ:</strong>
        <select id="aspectSelect" onchange="render()"></select>
    </div>
    <div>
        <strong>評価フィルタ:</strong>
        <div class="btn-group">
            <button id="btn-all" onclick="setSentiment('all')" class="active-all">すべて</button>
            <button id="btn-p" onclick="setSentiment('p')">ポジティブ (〇)</button>
            <button id="btn-n" onclick="setSentiment('n')">ネガティブ (×)</button>
        </div>
    </div>
</div>

<div id="container"></div>

n": "フィット感も良く外れにくいと思います", "original_review": "初めてワイヤレスイヤホンを買いましたが、とても音質が良いと思います。 フィット感も良く外れにくいと思います。 やはりなんと言ってもケーブルがないので、引っかかったりする事などのストレスが無くて良いと思いました。"}, {"evaluation": "耳へのフィット感も自分には合っているようで激しく動いても外れることは無いです", "original_review": "これまで使ってきた物とは格段に音質が違いました。 今まで使っていたのはリーズナブルな製品で価格が全然違うため比べる事自体間違いかもしれませんが…。 特に低音の響きが良く心地イイ振動が耳に広がります。 耳へのフィット感も自分には合っているようで激しく動いても外れることは無いです。 価格はそれなりにしますが購入して良かったと思っています。"}, {"evaluation": "フィット感は、サイコーです", "original_review": "ケーブル付のBluetoothイヤホンは持っていましたが、ランニング中にコードが擦れて気になるので、この商品を購入。 フィット感は、サイコーです。 カナル型じゃないので圧迫感も少ないし、音量を下げれば、外の音も聞き取れます。 低音が少し強いかなとは思いますが、カナル型の様にイヤーピースの大きさで、調整できないので、こんなもんかなと思います。 ケースから取り出して、電源ONで機器と自動接続、閉まって電源オフは、思った以上に使い勝手が良いです。"}, {"evaluation": "フィットして落ちることもなくとても満足です", "original_review": "ジョギングが趣味ですので、それ用に購入しました！！ 音質もよく、フィットして落ちることもなくとても満足です(^^) おかげで快適なジョギングができそうです！"}, {"evaluation": "不安があった耳へのフィット感も問題がなく", "original_review": "レビュークラブよりモニター品を借りてレビューしています。 朝のランニング時に音楽を聴くことを長年の趣味として楽しんでいます。 ヘッドフォンやイヤフォン、ワイヤレスと様々なものを試してきましたが、このBose SoundSportの音質と耳の快適さには、音楽を聴く楽しみをまた一度、思い直させられました。 音、一音一音の良さと言うより、音の繋がりや流れがとても心地よく聞こえ、耳触りが自分に丁度良かったですし、不安があった耳へのフィット感も問題がなく、ランニング中も外れることなく使用できました。"}, {"evaluation": "FITもすごくいいですよ", "original_review": "青歯の通信はおとが悪いという先入観もあり、コードレスだからいいかなと軽い感じでかいましたがびっくりしました。ノイキャンはどうしても時々違和感があるので全くない素のおとがすごくいいんです。 電車とかだと遮音はほとんどないので予めそれを認められる人が満足されるとおもいます。音は１週間切れていません。バッテリも十二分。FITもすごくいいですよ。"}, {"evaluation": "耳への装着感が心配でしたが頭を左右に振ってもずれたりしません！", "original_review": "かなり良いです！音質はもちろん、接続は良好でワイヤレスであることを全く感じません！耳への装着感が心配でしたが頭を左右に振ってもずれたりしません！ この商品を、買って良かったです"}, {"evaluation": "音も良く耳にもフィットします", "original_review": "使用して約1カ月ですが、大満足です。 音も良く耳にもフィットします。"}, {"evaluation": "イヤーピースが独特の形をしていて落ちないです", "original_review": "レビュークラブから送って頂き使用しています。 まずペアリングは爆速です。ケースから取り出すとすぐ繋がるのでこの点は凄く良い。 スポーツを楽しんでいる時に付けるのも本当に向いていて、イヤーピースが独特の形をしていて落ちないです。 肝心な音は、ハイがこもりがちであまりいい音とは言えないです。ノイズキャンセルも非搭載なので、あまり音質は期待しないほうが良いのかも。 今回ほんとうに残念だったのは、左耳だけの使用は出来ないということ。片方使って片方は充電というスタイルで使用するつもりでしたが、右耳がホストになっているからか「左耳だけで使用する」というのは出来ませんでした。他にも通話モード（低遅延）になると左耳の出力がなくなり、右耳のみになります。ハンズフリー通話をメインで使う方は注意したほうが良いかと。"}, {"evaluation": "耳へのフィット感も良く、ゴルフのプレー前の練習時にも違和感なく使えています", "original_review": "レビュークラブよりモニター品を借りてレビューしています。 商品が届き、箱から出した時から、「これは期待ができる」と感じてしまう作りです。 これは実際に手にしないとわからない感覚です。 ケースが、充電器を兼ねていますが、白色に光るイルミネーションはとても心地よく、また残量がひと目で分かるので、充電切れを起こすこと無く使っています。 サウンドに関しては、文句のつけようがないです。 10年前に購入したイヤフォンとは全く違う音質で大満足です。 耳へのフィット感も良く、ゴルフのプレー前の練習（ドライビング、チッピング、パター）時にも違和感なく使えています。 特にゴルフは、雑音が気になる場合がありますが、この製品を使うと外部からシャットダウンされるため、集中力も高まります。"}, {"evaluation": "こちらで買った時はピタリとあいすごく綺麗に音が聴けます", "original_review": "彼にプレゼントとして奮発した買い物をしました。お店で聞いた時は耳にうまくフィットしませんでしたが、サイズが合わなかっただけなのかこちらで買った時はピタリとあいすごく綺麗に音が聴けます。彼も大喜びしてました！ありがとうございます！"}, {"evaluation": "フィット感にびっくりしていました◎", "original_review": "旦那さんへの誕生日プレゼントに購入しました！フィット感にびっくりしていました◎"}, {"evaluation": "フィット感に関しては問題なしです", "original_review": "音はよいです。高音、低音とも自然な感じです。私個人的にはもう少しドンシャリ感があったほうが好みではあります。音の立体感が今まで私の使用してきたイヤホンの中では一番よかったです。ただし同時に開放型ゆえの外音遮断性が大小さくまた音漏れも大きいので例えば電車での使用にはあまり向いてないと思います。フィット感に関しては問題なしです。音とびは少しあります。毎回外を歩いていて同じ場所でおこるので何か外的要因があるのでしょうかね。"}], "evidence_count": 22}, {"nugget_id": "itemA_フィット感_ポジティブ_003", "text": "激しく動いても外れない", "item_id": "itemA", "aspect": "フィット感", "sentiment": "ポジティブ", "evidence_list": [{"evaluation": "外れにくいのが便利ですね。", "original_review": "さすがBOSEです。寝る時に使ってますが、外れにくいのが便利ですね。 アプリとスマホのタイマーを使うとオートオフもしてくれるので、バッテリーも節約もできます。 とにかく音もいいので満足してます。３０日の返却サービスもありますが使わないと思います。"}, {"evaluation": "ジョギングしてても外れません", "original_review": "・第一印象 サイズが大きく、耳から飛び出たようなデザイン。もう少しコンパクトならベストです。 デザイン自体はかっこいいと思います。 ただ、充電ケースが非常にコンパクトで、持ち運びは苦にはなりません。 ・音質 低音がしっかり響きます。 遮音性は、ほぼありません。ジョギング中には、外の音が聞こえないと危ないのでこれでいいと思います。 ・フィット感 ジョギングしてても外れません。 最初は少し心配でしたが、意外としっかりフィットしています。 万が一のために、イヤーフックがあると尚良いかと思います。 今回は、レビュークラブよりモニター品をお借りして使用しています。"}, {"evaluation": "フィット感がよく動いても気になりません", "original_review": "とても良い音で満足です。フィット感がよく動いても気になりません。動画再生時にわかる若干の音ズレはありますが、気になる程のものではありません。やはり場所によっての音切れは多少有ります。これも頻繁ではないので許容範囲内だと思います。"}, {"evaluation": "フィット感も良く外れにくいと思います", "original_review": "初めてワイヤレスイヤホンを買いましたが、とても音質が良いと思います。 フィット感も良く外れにくいと思います。 やはりなんと言ってもケーブルがないので、引っかかったりする事などのストレスが無くて良いと思いました。"}, {"evaluation": "耳へのフィット感も自分には合っているようで激しく動いても外れることは無いです", "original_review": "これまで使ってきた物とは格段に音質が違いました。 今まで使っていたのはリーズナブルな製品で価格が全然違うため比べる事自体間違いかもしれませんが…。 特に低音の響きが良く心地イイ振動が耳に広がります。 耳へのフィット感も自分には合っているようで激しく動いても外れることは無いです。 価格はそれなりにしますが購入して良かったと思っています。"}, {"evaluation": "フィットして落ちることもなくとても満足です", "original_review": "ジョギングが趣味ですので、それ用に購入しました！！ 音質もよく、フィットして落ちることもなくとても満足です(^^) おかげで快適なジョギングができそうです！"}, {"evaluation": "首を振りまくっても落ちません。", "original_review": "音もいいし、ケースも小ぶりでおしゃれ。 AirPodsと迷いましたが断然こちらのが丈夫でよかった。 首を振りまくっても落ちません。 発送も早く、すぐに届き嬉しかったです。"}, {"evaluation": "1回も外れる事無く高音質で快適なランニングが出来ました。", "original_review": "本日StayHear+ SportチップをMサイズ→Sサイズへ変更し１０Kｍランニングに行きましたが1回も外れる事無く高音質で快適なランニングが出来ました。返品しなくて良いことに大変満足しています。基本的にランニングでの使用ですので不満に思うことはありませんが、強いて言うならば、どのくらいの期間、内蔵電池が使用出来るかですね。良い買い物が出来ました。今後もBOSEを愛用したいのでスポーツに特化した益々の小型化を期待しています。"}, {"evaluation": "耳への装着感が心配でしたが頭を左右に振ってもずれたりしません！", "original_review": "かなり良いです！音質はもちろん、接続は良好でワイヤレスであることを全く感じません！耳への装着感が心配でしたが頭を左右に振ってもずれたりしません！ この商品を、買って良かったです"}, {"evaluation": "イヤーピースが独特の形をしていて落ちないです", "original_review": "レビュークラブから送って頂き使用しています。 まずペアリングは爆速です。ケースから取り出すとすぐ繋がるのでこの点は凄く良い。 スポーツを楽しんでいる時に付けるのも本当に向いていて、イヤーピースが独特の形をしていて落ちないです。 肝心な音は、ハイがこもりがちであまりいい音とは言えないです。ノイズキャンセルも非搭載なので、あまり音質は期待しないほうが良いのかも。 今回ほんとうに残念だったのは、左耳だけの使用は出来ないということ。片方使って片方は充電というスタイルで使用するつもりでしたが、右耳がホストになっているからか「左耳だけで使用する」というのは出来ませんでした。他にも通話モード（低遅延）になると左耳の出力がなくなり、右耳のみになります。ハンズフリー通話をメインで使う方は注意したほうが良いかと。"}], "evidence_count": 10}], "nuggets_b": [{"nugget_id": "itemB_フィット感_ポジティブ_002", "text": "イヤホンは耳にしっかりフィットする", "item_id": "itemB", "aspect": "フィット感", "sentiment": "ポジティブ", "evidence_list": [{"evaluation": "防水でかつしっかり耳にジャストフィットしました", "original_review": "ジムのトレーニング用にワイヤレスのイヤホンが欲しかったので購入しました。 しっかりした箱に梱包されてて、開けると自分用にカスタマイズ出来るようになってました。 防水でかつしっかり耳にジャストフィットしました。 音質もなかなか良かったです。 この値段で大満足です。 コスパ最強！！！"}, {"evaluation": "ランに使用していますが、イヤホンもずれることはありませんでした", "original_review": "ジムのラン用に購入。 はじめて、ワイヤレスイヤホンを購入。 音量の調節は、イヤホンではできませんが、この価格で、音の質感は、かなり高いほうだと思います。 ラン以外で使用したときに、重低音がすごいな～と感じましたので...。 ランに使用していますが、イヤホンもずれることはありませんでした。"}, {"evaluation": "フィット感も良い！", "original_review": "音質もクリアでデザインもクール！ フィット感も良い！"}, {"evaluation": "密着感がすごくてちょっとやそっとじゃ外れそうにありません", "original_review": "iPhone8ユーザーということで、完全ワイヤレスイヤホンを探していました。 ネットや雑誌の評価を確認してこちらを購入しました。 それらの評価通り、密着感がすごくてちょっとやそっとじゃ外れそうにありません。音質も自分的には十分で、よっぽどこだわる人だったらもっと高いのを買えばいいだけの話です。 とにかく値段以上の働きを見せてくれています。 あとはバッテリーの劣化がどの程度で進むかが気になるところですが、使ってみないと分かりません。しばらく使い続けたいと思います。"}, {"evaluation": "付けていてイヤホンが落ちる感覚は全くありませんでした", "original_review": "どれがいいか迷い、１万円以下で知ってるメーカー、評価が高いものを探して結局アンカーの製品だったので購入しました。 木曜日に注文して土曜日に届きました。 １週間使ってみました。 １度だけですが満員のバスの中でも動作不良とかは無かったです。１週間のうち１度だけ左だけ聞こえないことがありましたが説明書どうりケースに戻してからまた取り出したら直りました。 音の遅延は両耳だと若干あります。動画等を観ていると日本語吹き替えの映画を見てるみたいな感じです。右耳だけだと遅れず聞こえました。左耳だけでは起動しません。 バッテリーは１日１時間半～２時間半使用して１週間ケースの充電はいりませんでした。まだ残量のランプが２個ついているので、このペースなら後１週間は使えそうです。 付けていてイヤホンが落ちる感覚は全くありませんでした。髪を手で払ったりしたときも引っ掛かることもほとんどないし、何度か指があたった事もありましたが、全然ズレもしないし落ちなかったです。 他の方も言ってましたが、密着力がすごいので、周りの音は聞こえづらいですが、コンビニのお会計とかは私はそのままでも大丈夫でした。再生停止、曲送り等がボタンひとつで出来るので、とても操作しやすかったです。 いいお買い物でした。 黒もカッコよくて気に入っていますが、しいて言えば他のカラーもあったら嬉しかったです。"}, {"evaluation": "耳にフィットし、ジョギングしながら聞けて外れません", "original_review": "耳にフィットし、ジョギングしながら聞けて外れません。コスパ抜群にいいです。これは買いですね。 ただ難を言えばイヤホン側で音量を調節できないとこ、ボタンが押しにくい、と言ったところか。 でもそこを考えてもとてもいいです。"}, {"evaluation": "誰の耳にもフィットするようなセットが付いていて耳の小さい私にも付けることができそうなので、自分のも購入検討中です", "original_review": "主人の誕生日プレゼントでホワイトを購入しました。 音も聞きやすく、通話も問題ありませんでした。 誰の耳にもフィットするようなセットが付いていて耳の小さい私にも付けることができそうなので、自分のも購入検討中です。"}, {"evaluation": "僕にはちょうど耳にフィットして音も良いです", "original_review": "僕にはちょうど耳にフィットして音も良いです 少しでかい感じがするので 女性より男性の方が向いてる商品なのかも知れませんね 電車でも使ってみましたが あまり雑音はありません 音にこだわる人なら 電池持ちの少ないけど SONYのノイズキャンセリングのやつの方が良いかもですけど 電池持ち 装着感 スイッチなしで 音楽が聴ける 手軽さを考えるとこっちの方がいいのでは"}, {"evaluation": "これはフィット感がよく、長い距離を走っても外れず快適。", "original_review": "ランニング用に購入。できるだけ軽装で走りたく、いろいろ試しましたが、これはフィット感がよく、長い距離を走っても外れず快適。ケーブルもなくストレスフリー。使用開始時も充電ボックスから取り出すだけでスマホと繋がるので、すぐ始動できて嬉しいです。アンカーの商品は安くてモノが良く、いつも当たりです。今回もアンカーを信頼して買って良かったです。"}, {"evaluation": "フィット感も良いのに残念", "original_review": "説明書にSONY製品とは時々相性が悪い的なことが書いてありますが、その通り、私のXPERIA XZsでは最初は接続される度に音量MAXになり注意が必要でした。音切れもチョイチョイ発生し、ANKERに連絡しましたが、「他のの端末ではどうでしょう？」と言われ、Ipadで接続してみたら絶好調・・・。 その後、なぜか接続される度に音量MAXは治まり、快適に使えていたのですが、購入後1年を超えたころからXPERAの接続時のみ音量が小さくなり、音量MAXにしても普通に聞こえる程度。 ただしIpadで使うと普通に調子が良い・・・。 XPERIAで他のワイヤレスイヤホンは普通に使えているので、やはり相性の問題なのでしょうか。フィット感も良いのに残念。"}, {"evaluation": "装着感", "original_review": "これまでBluetoothイヤホンを使っていましたが、今回ランニング用に完全ワイヤレスイヤホンを探しており、色々な口コミを見た上で、こちらを購入しました。 装着感、スマホとスムーズな接続、電池の持ち、そして何より音質が良い、これら全てに満足しています。この価格でこの品質はオススメです。 なお、人ごみの中、もしくはたまに外部からのノイズを受けて？、接続が途切れることはありますが、それほど気にならないレベルです。"}, {"evaluation": "耳にフィットするので、そんなに大きな音にしなくても、周囲の雑音も気になりません", "original_review": "色々なレビューがあり、不安もありましたが、Ankerブランドを信じて購入しました。接続も着け心地も、音質も問題なく、快適に使っています。耳にフィットするので、そんなに大きな音にしなくても、周囲の雑音も気になりません。よい買い物をしたと思います。"}, {"evaluation": "耳へのフィット感も問題なし", "original_review": "期待以上に使えます。耳へのフィット感も問題なし。音飛び音切れは今のとこないのでこれも問題なし。"}, {"evaluation": "着け心地は思っていたよりもフィットして落ちる様子はないです", "original_review": "初めてのワイヤレスイヤホン。 おすすめで調べて、一番コスパが良いとのことで購入を決意。 セットアップがわからないとのレビューもありましたが、説明書が簡潔で私は良かったです。 簡潔故に、詳しくはわからないのかも知れませんが、使うのに苦労しません。 着け心地は思っていたよりもフィットして落ちる様子はないです。 ケースに入れて持ち歩いても軽いし気に入りました。 ウォークマン用に購入しましたが、音とびないです。 スマホでも使ってみましたが、スマホだとたまに音が途切れますが、メインで使わないので気になりませんでした。"}, {"evaluation": "走ったりしてもずれたりしません", "original_review": "コスパの良いイアホンを探していたところ見つけました。私的には音も充分満足できますし、走ったりしてもずれたりしません。ケースの大きさもちょうどいいです。購入して大満足でした。"}, {"evaluation": "意外にフックなしでもしっかりはまって抜け落ちません", "original_review": "悩みに悩んで買いました。満足です。ペアリング、音質、デザイン共に問題なし。 抜け落ちると思ってイヤーフックつきのものばかり探していたのですが、意外にフックなしでもしっかりはまって抜け落ちません。(私は、ですが…)"}, {"evaluation": "イヤホンも外れにくく設計してありある程度のランニングでも外れにくいと思う。", "original_review": "使い始めて約1年 時々 左耳が 聞こえなくなる時もあるけど すぐに 改善される。 音声も全く問題ない クオリティ。 イヤホンも 外れにくく 設計してありある程度のランニングでも外れにくいと思う。 充電も 一週間以上持つし 、高音質 を追及しないのであれば、一般使いとしてはほぼ100点。"}, {"evaluation": "耳にふゎっと着けられて、落とす感じは全くないです", "original_review": "耳にふゎっと着けられて、落とす感じは全くないです。音もマイクも問題ないです。Siriに「xxに電話かけて」と頼むと繋がるし、音量も変えてくれるしで、iPhoneの本体があることを忘れてしまいそうな程。 設定も特にどうということも無く、あっさりと完了。ケースもコンパクトでいい感じです。 凄い便利ですね。家族のために買ったのですが、自分用にもう一つ買う事にしました。"}], "evidence_count": 18}, {"nu す子供に購入しました。音質がいいこと、フル充電で長時間使えることがいいと話していました。"}, {"evaluation": "とにかく音もいいので満足してます", "original_review": "さすがBOSEです。寝る時に使ってますが、外れにくいのが便利ですね。 アプリとスマホのタイマーを使うとオートオフもしてくれるので、バッテリーも節約もできます。 とにかく音もいいので満足してます。３０日の返却サービスもありますが使わないと思います。"}, {"evaluation": "ボーズの音造りに不満のない人は選んで損はないです", "original_review": "初ワイヤレスイヤホン、他社品と商品選定でいろいろ悩みました。決して安い商品ではないですが、ボーズの音造りに不満のない人は選んで損はないです。しっかり耳にはまるので落ちることはなさそうです。iPhoneとのペアリングも問題なかったです。自分はあまり操作することは無いので問題ないですが、イヤホン部のボタンが少し硬くて操作しにくい気がします。"}, {"evaluation": "自然でクリアーな音質はかなりいいです。もちろん低音も。", "original_review": "Boseはオーディオ用スピーカーから使っていますが、やっぱり期待を裏切りません。自然でクリアーな音質はかなりいいです。もちろん低音も。購入前は少し大きいかなと思ってましたが、耳へのフィット感、機能を追求した結果だと使ってみてわかりました。ケースもシンプルでカッコいいです。"}, {"evaluation": "音も最高に良いし充電も楽", "original_review": "今まで有線のイヤホンしか使用してなかったので、Bluetoothイヤホンは非常に便利です。音も最高に良いし充電も楽。 値段が高かったので悩みましたが、購入して良かったです。"}, {"evaluation": "BOSEらしい音で満足しています", "original_review": "室内でのトレーニング用に購入しました。BOSEらしい音で満足しています。 ただボリュームボタンが不良品かと思うほどに固くて操作し難いです。個体差でしょうか?"}, {"evaluation": "音も期待以上で、音切れもなく、満足してます", "original_review": "注文した翌日に届き、梱包も丁寧でした。 音も期待以上で、音切れもなく、満足してます。"}, {"evaluation": "とても良い音で満足です", "original_review": "とても良い音で満足です。フィット感がよく動いても気になりません。動画再生時にわかる若干の音ズレはありますが、気になる程のものではありません。やはり場所によっての音切れは多少有ります。これも頻繁ではないので許容範囲内だと思います。"}, {"evaluation": "音はとてもいいですし", "original_review": "やはり音はとてもいいですし、 デザインも素敵！ 一番のポイントは、充電ケースがあること。 今のところ耳も痛くならないですし、 本当なら買ってよかった！"}, {"evaluation": "流石の音質", "original_review": "初めてboseのイヤホンを手にしました。そこで良かった点と、イマイチだと思った点を大まかにレビューしようと思います。 良い点 ・流石の音質 ・大きさによらず軽い ・充電ケースが使いやすい ・携帯をリビングで充電していても家中音楽を聴きながら歩き回れる イマイチだと思った点 ・デカイ ・ゲームや動画は遅延が多いため使えない ・iPhoneで7、8割の音量にあげるとなぜか音量が下がる(イヤホンから出る音が小さくなる)。9割以上にすると急に大音量になる ・耳につけて歩くと補聴器のようで少し外でつけづらい 商品の感想  流石boseのイヤホンだけあって音量はとてもいいです。 しかし、音量の良さや遠くまでBluetoothが届く高機能のおかげで本体自体はかなり大きくなってしまい、軽いのですが、つけた時の見た目が少しかっこ悪いです。 あとは動画やゲームを多用する自分にとっては音声の遅延は致命的で自分の用途にはあっていなかったなと思いました。最近ではイヤホンジャックのついていないスマホの普及により遅延を限りなく少なくしたBluetoothイヤホンなどあるので、その機能がこちらについていないのは残念でした。 ですが、音楽を聴く分にはとても良い商品だと思いました。"}, {"evaluation": "音は申し分ございません。", "original_review": "購入ボタンを押してから、発送完了までがめっちゃ早くびっくりしました！ さすが、BOZEです。音は申し分ございません。ランニングで線が煩わしく、音にもこだわっていたので自分用に購入しました!"}, {"evaluation": "音質もさすがBOSE。", "original_review": "音質もさすがBOSE。 主にiPhoneで使用していますが、もう少しボリュームが出せればいいかなと思いました。 また、これはBuetooth全般に言えることですが、どうしても音が若干遅れるため、動画には向かないです。 日々音楽を楽しむ上では申し分ないです。"}, {"evaluation": "とても音質が良いと思います", "original_review": "初めてワイヤレスイヤホンを買いましたが、とても音質が良いと思います。 フィット感も良く外れにくいと思います。 やはりなんと言ってもケーブルがないので、引っかかったりする事などのストレスが無くて良いと思いました。"}, {"evaluation": "このタイプも、好みの音質で毎日が楽しみになりました", "original_review": "注文して、迅速、スピーディーに 商品が届いて １週間あまり 今まで、ヘッドホンタイプを使用してましたが このタイプも、好みの音質で 毎日 が楽しみに なりました。"}, {"evaluation": "音質いい。", "original_review": "思っていたほどの感動はしななかったけどいいと思います。 音質いい。つけ心地いい。重さもいい。"}, {"evaluation": "これまで使ってきた物とは格段に音質が違いました", "original_review": "これまで使ってきた物とは格段に音質が違いました。 今まで使っていたのはリーズナブルな製品で価格が全然違うため比べる事自体間違いかもしれませんが…。 特に低音の響きが良く心地イイ振動が耳に広がります。 耳へのフィット感も自分には合っているようで激しく動いても外れることは無いです。 価格はそれなりにしますが購入して良かったと思っています。"}, {"evaluation": "音は期待通りBOSEです。", "original_review": "音は期待通りBOSEです。 わかっていたことですご、予想通り大きいですね。訳あってのこととは思いますが、もう少し小さければなお良いかと思います。 装着して両耳を手のひらで覆うと、音が途切れます。普通はそんなことしませんが、Bluetoothでは、途切れが結構話題になってますから。日常使いでどの程度か、これから使ってみて評価になると思います。 遅延については、メーカーもかなり努力されてるようです。アップデートの案内にその説明がありました。 今のところ気になるような問題はありません。 満足してます。"}, {"evaluation": "Bluetooth接続でこの音質にはさすがBOZEです", "original_review": "初めての完全ワイヤレスイヤホンでしたので、失敗したくないと思い、昔からスピーカーといえばBOZEと、絶対的な信頼を持っていたのでこの商品にしました。 大正解でした。Bluetooth接続でこの音質にはさすがBOZEです。厚みのある低音と切れの良い高音が同居していて、なおかつ中音域もしっかりクリアに聴こえます。低音域を伸ばすと音が曇ったり、高音域を伸ばすと音が軽くなったりしますが、このワイヤレスイヤホンはその様な事がありません。 装着感も良く、重さも気にならない程度で、さらに完全にワイヤレスなので着けていることを忘れるくらい快適です。 ただ、1つだけ気になったのは、iphoneのミュージックプレイヤーで音量を80％程度にしたら、低音が割れてる?本体が震えてビビッてる?様な音がします。BOZEなので音割れは無いだろうと期待していましたが、音量を上げ過ぎると「ビビビビ」という音が聴こえます。私は大音量で音楽を聴きたい方なので、そこが少しひっかりました。なので正確には星4.8くらいの満足度です。 普通の音量での使用であれば、間違いなく満点の商品です。"}, {"evaluation": "やっぱりBOSEは音がいい。", "original_review": "２台目購入。やっぱりBOSEは音がいい。他メーカー品をいくつか買って使っていたけど物足りず、結局、BOSEに行き着いた。"}, {"evaluation": "音質も低音がきいててBOSEらしく最高。", "original_review": "完全にワイヤレスなのがとてもいい。 音質も低音がきいててBOSEらしく最高。 使わないときに入れておく充電器もシンプルで、カッコいい。かなり気に入ってます！"}, {"evaluation": "音はとてもいいですが、今メインで使っているウォークマンとの相性が悪いのか、片耳しか接続できないことが多いです", "original_review": "音はとてもいいですが、今メインで使っているウォークマンとの相性が悪いのか、片耳しか接続できないことが多いです。iPHONEとの相性は特に問題ないので、４点としました。"}, {"evaluation": "音質がここまで違うのかというのが正直な感想です。", "original_review": "ワイヤレスのイヤホンをいろいろ試してます。 Boseは良いのは知ってましたが、高価でなかなか手を出せずにいました。今までのイヤホンは、高音の音質が合わないのか耳が痛くなって疲れてしまうので、思い切って購入しました。音質がここまで違うのかというのが正直な感想です。個人の表現ですが、音質の角がなくまろやか、低音の響きも良く頭の中で心地よい音楽が流れます。バッテりーの持ちも長いので良いです。少し大きいのが気になるので、ー☆としましたがそれを差し引いても満足です。"}, {"evaluation": "思っていたより音が良く大変満足です", "original_review": "初めてのBOSE。発売当初からいいなぁと思っていましたが、買うきっかけがなく保留。前の物が壊れたので、これを機に購入しました。すぐに届きました。思っていたより音が良く大変満足です。YouTubeなどは多少ラグを感じますが、今のところ不便は感じていないです。"}, {"evaluation": "めちゃくちゃ音がいいと絶賛してくれました", "original_review": "恋人に誕生日プレゼントとして贈りました。 ジムで使用しており、めちゃくちゃ音がいいと絶賛してくれました。"}, {"evaluation": "ワイヤレスにしては音もよく、聴きやすい味付けです", "original_review": "注文した翌日に届きました。 ワイヤレスにしては音もよく、聴きやすい味付けです。ケースを出したあと、すぐに自動でペアリングされるのも便利です。 ただ、レビューにもあるようによく左耳の接続が切れます。ファームウェアのアップデートで改善されるのを期待します。"}, {"evaluation": "流石BOSE、いい意味で期待を裏切ってくれました", "original_review": "左から、音が出ない時もたまにありますが、左イヤホンのBluetoothのswitchを押せば即繋がります。他の方のレビューもあったので自分的には、こんなもんでしょぐらいの気持ちで使ってます。それよりも、コードの煩わしさが無くなったのが1番です。音質は以前車のスピーカーで使ってたこともあり、イヤホンではどうかなと思ってましたが、流石BOSE、いい意味で期待を裏切ってくれました。後は耐久性、長く使えるといいなぁと。"}, {"evaluation": "音質、コードレスの利便性からこちらを購入。", "original_review": "日常使いで購入しました。 BOSEが欲しかったので、SoundSportと悩みましたが、音質、コードレスの利便性からこちらを購入。 非常に満足しています。 他の方のレビューにもあるように、左側の音途切れはありますが、そこはコードレスと割り切ってます。 自分の耳問題と思いますが、右側のフィッティング感がイマイチの為、星4つをつけさせてもらいました。"}, {"evaluation": "音質、音量取扱は簡単でした", "original_review": "ブルートゥースを利用したヘッドホン、音質、 音量取扱は簡単でした。 常にケース入れることが必要ですが中々おシャンティです。"}, {"evaluation": "音質もよく", "original_review": "ジョギングが趣味ですので、それ用に購入しました！！ 音質もよく、フィットして落ちることもなくとても満足です(^^) おかげで快適なジョギングができそうです！"}, {"evaluation": "音もいいし、ケースも小ぶりでおしゃれ", "original_review": "音もいいし、ケースも小ぶりでおしゃれ。 AirPodsと迷いましたが断然こちらのが丈夫でよかった。 首を振りまくっても落ちません。 発送も早く、すぐに届き嬉しかったです。"}, {"evaluation": "音はとても良いです♪", "original_review": "今まで、使用していたヘッドフォンが壊れてしまったので、ずっと気になっていたこちらの商品を購入しました。Bluetooth 設定 が ment": "ポジティブ", "evidence_list": [{"evaluation": "自然でクリアーな音質はかなりいいです。もちろん低音も。", "original_review": "Boseはオーディオ用スピーカーから使っていますが、やっぱり期待を裏切りません。自然でクリアーな音質はかなりいいです。もちろん低音も。購入前は少し大きいかなと思ってましたが、耳へのフィット感、機能を追求した結果だと使ってみてわかりました。ケースもシンプルでカッコいいです。"}, {"evaluation": "低音がしっかり響きます", "original_review": "・第一印象 サイズが大きく、耳から飛び出たようなデザイン。もう少しコンパクトならベストです。 デザイン自体はかっこいいと思います。 ただ、充電ケースが非常にコンパクトで、持ち運びは苦にはなりません。 ・音質 低音がしっかり響きます。 遮音性は、ほぼありません。ジョギング中には、外の音が聞こえないと危ないのでこれでいいと思います。 ・フィット感 ジョギングしてても外れません。 最初は少し心配でしたが、意外としっかりフィットしています。 万が一のために、イヤーフックがあると尚良いかと思います。 今回は、レビュークラブよりモニター品をお借りして使用しています。"}, {"evaluation": "音質は前のSennheiserの有線イヤホンの方が個人的には好みですが、Boseなので低音はしっかり出ててそこそこ満足です", "original_review": "今まで有線イヤホンを使ってましたが、線が引っかかる度に耳が引っ張られてイライラしてたので、思い切って購入。（iPhone6で使ってます） ワイヤレスは、電車で使う方には特に便利だと思います。引っかからないし、荷物も色々あるのに線を巻き巻きしてカバンになおしたりしなくていいので。 音質は前のSennheiserの有線イヤホンの方が個人的には好みですが、Boseなので低音はしっかり出ててそこそこ満足です。 接続も、満員電車内でも今のところ特に途切れたりしたことは無いです。 ブルーとイエロー、おしゃれです。"}, {"evaluation": "SoundSport Freeの方が、低音もよく、音では比較にならないぐらい良いように思います", "original_review": "Air Podsを含め、複数の完全ワイヤレスイヤホンを所有しております。Air Podsも切れないのはいいのですが、SoundSport Freeの方が、低音もよく、音では比較にならないぐらい良いように思います。"}, {"evaluation": "音質も低音がきいててBOSEらしく最高。", "original_review": "完全にワイヤレスなのがとてもいい。 音質も低音がきいててBOSEらしく最高。 使わないときに入れておく充電器もシンプルで、カッコいい。かなり気に入ってます！"}, {"evaluation": "低音の響きも良く頭の中で心地よい音楽が流れます。", "original_review": "ワイヤレスのイヤホンをいろいろ試してます。 Boseは良いのは知ってましたが、高価でなかなか手を出せずにいました。今までのイヤホンは、高音の音質が合わないのか耳が痛くなって疲れてしまうので、思い切って購入しました。音質がここまで違うのかというのが正直な感想です。個人の表現ですが、音質の角がなくまろやか、低音の響きも良く頭の中で心地よい音楽が流れます。バッテりーの持ちも長いので良いです。少し大きいのが気になるので、ー☆としましたがそれを差し引いても満足です。"}, {"evaluation": "音は低音が響き、気になっていた音漏れもなく、満足です", "original_review": "日頃、帰宅時間が遅いので、コンビニ受け取りができてありがたかったです。 おかげで注文後、2日で商品を手にすることができました。 12月発売のオレンジを注文しました♪ 音は低音が響き、気になっていた音漏れもなく、満足です。"}, {"evaluation": "音はよいです。高音、低音とも自然な感じです。音の立体感が今まで私の使用してきたイヤホンの中では一番よかったです。", "original_review": "音はよいです。高音、低音とも自然な感じです。私個人的にはもう少しドンシャリ感があったほうが好みではあります。音の立体感が今まで私の使用してきたイヤホンの中では一番よかったです。ただし同時に開放型ゆえの外音遮断性が大小さくまた音漏れも大きいので例えば電車での使用にはあまり向いてないと思います。フィット感に関しては問題なしで 質の違いにびっくりしました。 しかも、着けているのを忘れるくらい自然な着け心地です。値段もお手頃で大変満足です。"}, {"evaluation": "音質に関しては特に詳しくないが、こもってる感じもせず満足している", "original_review": "ケースがしっかりした作りで、マグネットで閉じる作りや不思議な形の両面テープで留まってたのも面白かった。 ペアリングは簡単に出来たので良かったが、イヤホンにつけるカバーをすると充電時の接続が非常に悪くなり、右だけ充電出来ていないという状態が２日続いたのでカバー外して1週間使用したが、その後充電は問題無くなった。むしろ磁石でカチっと止まるのが分かったので、非常に安定している。 音質に関しては特に詳しくないが、こもってる感じもせず満足している。 つながり関しては、都営大江戸線の駅に入るところから不安定になり左側が切れだし、地下鉄に乗っている間は左側が切れることが頻繁にある。鞄に入れているよりはポケットにXPERIA XZ1を入れている方が安定している気がする。ただ、ポケットに入れていても有楽町～有楽町マルイ間でも1～2回左だけ切れた。 音が鳴っていないときは着けたままでも会話出来るが、音楽を聞いていると外の音はほぼ聞こえない。ノイキャンまでの性能不明。 追記:その後大江戸線で途切れることは減っている。都営新宿線から小田急線へ乗り換えた際に使用してみたが、神保町でブツブツ途切れた程度で満員電車内では左が多少途切れる程度。新宿での乗り換えの際には都営改札を出る前からブツブツ途切れ、乗り換え中のエレベーターは全くつながらず。小田急線の階段下りるまでつながらなかったため、新宿駅を利用する際はある程度諦め必要と思われる。"}, {"evaluation": "音もいいと思います", "original_review": "台風の中、いつもの早さで商品が到着しました。 Bluetoothの接続も問題無くて音もいいと思います。"}, {"evaluation": "とても良音質で音が割れたりすることはないので、よほど音質にこだわらない限りは十分です", "original_review": "初めての完全ワイヤレスイヤホンが欲しく、わりと安めでかつ性能を重視したイヤホンを探した結果、本商品を購入しました。 付けてみた感想ですが、まず音質についてです。とても良音質で音が割れたりすることはないので、よほど音質にこだわらない限りは十分です。続いてバッテリーについてですが、自分はこのイヤホンをおもに通学に使っています。（片道約2時間）その2時間でバッテリーが切れることはないです。（使う期間によってはバッテリーの劣化はあると思いますが）また、充電もすぐに完了するのでバッテリー切れしてもすぐ使うことができます。 ひとつ難点があるとすれば、少し大きめの形状をしたイヤホンなので、耳に合う合わないが多少あるかと思います。私の場合は、耳につける分には違和感はないのですが、歩いた振動などで耳から落ちそうになる時があります。そこさえ改善されていればこの価格では完璧だと思います。"}, {"evaluation": "何より音質が良い", "original_review": "これまでBluetoothイヤホンを使っていましたが、今回ランニング用に完全ワイヤレスイヤホンを探しており、色々な口コミを見た上で、こちらを購入しました。 装着感、スマホとスムーズな接続、電池の持ち、そして何より音質が良い、これら全てに満足しています。この価格でこの品質はオススメです。 なお、人ごみの中、もしくはたまに外部からのノイズを受けて？、接続が途切れることはありますが、それほど気にならないレベルです。"}, {"evaluation": "音質は概ね満足です", "original_review": "時々左耳の音が途切れることがありますが、音質は概ね満足です。少し重さは感じますが、この値段ですから仕方がないでしょう。"}, {"evaluation": "接続も着け心地も、音質も問題なく、快適に使っています", "original_review": "色々なレビューがあり、不安もありましたが、Ankerブランドを信じて購入しました。接続も着け心地も、音質も問題なく、快適に使っています。耳にフィットするので、そんなに大きな音にしなくても、周囲の雑音も気になりません。よい買い物をしたと思います。"}, {"evaluation": "音はいいです", "original_review": "ホワイトを購入しました。音はいいです。 レンジの近くでは、音が途切れますがそれ以外は 今の所途切れいません。 左右の文字は、非常に見にくいです。     // 状態管理
    let currentSentiment = 'all'; 
    let currentAspect = 'ALL';
    let mergedData = {};

    window.onload = function() {
        processAndSortData();
        initAspectSelect();
        render();
    };

    // データの加工とソート
    function processAndSortData() {
        mergedData = {};
        
        rawData.forEach(block => {
            const asp = block.aspect;
            if (!mergedData[asp]) {
                mergedData[asp] = { common: [], unique_a: [], unique_b: [] };
            }

            const sVal = block.sentiment ? String(block.sentiment).trim().toLowerCase() : '';
            const isPos = (sVal === 'positive' || sVal === 'ポジティブ' || sVal === 'p' || sVal.indexOf('pos') > -1);
            const sentimentKey = isPos ? 'positive' : 'negative';

            if (block.common_groups) {
                block.common_groups.forEach(g => {
                    const countA = getCount(g.nuggets_a);
                    const countB = getCount(g.nuggets_b);
                    g.totalCount = countA + countB;
                    g.countA = countA;
                    g.countB = countB;
                    g.sentiment = sentimentKey;
                    mergedData[asp].common.push(g);
                });
            }

            if (block.unique_a) {
                block.unique_a.forEach(n => {
                    n.count = getCount([n]);
                    n.sentiment = sentimentKey;
                    mergedData[asp].unique_a.push(n);
                });
            }

            if (block.unique_b) {
                block.unique_b.forEach(n => {
                    n.count = getCount([n]);
                    n.sentiment = sentimentKey;
                    mergedData[asp].unique_b.push(n);
                });
            }
        });

        Object.keys(mergedData).forEach(asp => {
            mergedData[asp].common.sort((a, b) => b.totalCount - a.totalCount);
            mergedData[asp].unique_a.sort((a, b) => b.count - a.count);
            mergedData[asp].unique_b.sort((a, b) => b.count - a.count);
        });
    }

    function getCount(nuggets) {
        if (!nuggets) return 0;
        return nuggets.reduce((acc, n) => acc + (n.evidence_list ? n.evidence_list.length : 0), 0);
    }

    function initAspectSelect() {
        const select = document.getElementById('aspectSelect');
        select.innerHTML = '<option value="ALL">すべての観点を表示</option>';
        Object.keys(mergedData).forEach(aspect => {
            const opt = document.createElement('option');
            opt.value = aspect;
            opt.textContent = aspect;
            select.appendChild(opt);
        });
    }

    function setSentiment(mode) {
        currentSentiment = mode;
        ['all', 'p', 'n'].forEach(m => {
            document.getElementById('btn-' + m).className = (m === mode) ? ('active-' + m) : '';
        });
        applyFilter();
    }

    function applyFilter() {
        const items = document.querySelectorAll('.item');
        items.forEach(item => {
            const isPos = item.classList.contains('pos');
            if (currentSentiment === 'all') {
                item.classList.remove('hidden-item');
            } else if (currentSentiment === 'p') {
                isPos ? item.classList.remove('hidden-item') : item.classList.add('hidden-item');
            } else if (currentSentiment === 'n') {
                !isPos ? item.classList.remove('hidden-item') : item.classList.add('hidden-item');
            }
        });
    }

    function render() {
        const container = document.getElementById('container');
        container.innerHTML = '';
        const aspectSelect = document.getElementById('aspectSelect');
        currentAspect = aspectSelect.value;

        const aspectsToShow = (currentAspect === 'ALL') ? Object.keys(mergedData) : [currentAspect];

        if (aspectsToShow.length === 0) {
            container.innerHTML = '<div style="padding:20px">データがありません</div>';
            return;
        }

        aspectsToShow.forEach(aspect => {
            const dataObj = mergedData[aspect];
            
            const card = document.createElement('div');
            card.className = 'aspect-card';
            
            const header = document.createElement('div');
            header.className = 'aspect-header';
            header.innerHTML = `<span>${aspect}</span>`;
            card.appendChild(header);

            const contentBox = document.createElement('div');

            dataObj.common.forEach(group => {
                const sentClass = (group.sentiment === 'positive') ? 'pos' : 'neg';
                const html = renderCommonGroup(group, sentClass);
                contentBox.insertAdjacentHTML('beforeend', html);
            });

            if (dataObj.unique_a.length > 0 || dataObj.unique_b.length > 0) {
                const html = renderUniqueGroup(dataObj.unique_a, dataObj.unique_b);
                contentBox.insertAdjacentHTML('beforeend', html);
            }

            card.appendChild(contentBox);
            container.appendChild(card);
        });
        
        applyFilter();
    }

    // ------------------------------------------------------
    // HTML生成ヘルパー関数
    // ------------------------------------------------------

    function renderCommonGroup(group, sentClass) {
        const id = 'common_' + Math.random().toString(36).substr(2, 9);
        const btnText = `A:${group.countA}件 B:${group.countB}件 ▼`;

        const listHtmlA = renderAggregatedEvidence(group.nuggets_a);
        const listHtmlB = renderAggregatedEvidence(group.nuggets_b);

        return `
            <div class="common-block item ${sentClass}">
                <div class="common-summary-wrapper">
                    <span class="common-badge">共通</span>
                    <span class="common-summary-text summary-text">${group.common_summary}</span>
                    <span class="count-badge" onclick="toggle('${id}')">${btnText}</span>
                </div>
                <div id="${id}" class="details-panel">
                    <div class="details-split">
                        <div class="details-col">
                            <div class="details-col-title">商品Aの評価</div>
                            <ul class="evidence-list">${listHtmlA}</ul>
                        </div>
                        <div class="details-col">
                            <div class="details-col-title">商品Bの評価</div>
                            <ul class="evidence-list">${listHtmlB}</ul>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderUniqueGroup(listA, listB) {
        const htmlA = listA.map(nugget => renderNuggetItem(nugget)).join('');
        const htmlB = listB.map(nugget => renderNuggetItem(nugget)).join('');

        return `
            <div class="comparison-cols">
                <div class="col">
                    ${listA.length > 0 ? `<div class="prod-title">商品A 固有</div>` : ''}
                    ${htmlA}
                </div>
                <div class="col">
                    ${listB.length > 0 ? `<div class="prod-title">商品B 固有</div>` : ''}
                    ${htmlB}
                </div>
            </div>
        `;
    }

    function renderNuggetItem(nugget) {
        const id = 'uniq_' + Math.random().toString(36).substr(2, 9);
        const count = nugget.count;
        const evidenceHtml = renderEvidenceList(nugget.evidence_list);
        const sentClass = (nugget.sentiment === 'positive') ? 'pos' : 'neg';

        return `
            <div class="item ${sentClass}">
                <span class="summary-text">${nugget.text}</span>
                ${count > 0 ? `<span class="count-badge" onclick="toggle('${id}')">${count}件 ▼</span>` : ''}
                <div id="${id}" class="details-panel">
                    <ul class="evidence-list">
                        ${evidenceHtml}
                    </ul>
                </div>
            </div>
        `;
    }

    function renderAggregatedEvidence(nuggets) {
        if (!nuggets || nuggets.length === 0) return '<li style="color:#ccc; font-size:0.8em; list-style:none;">該当なし</li>';
        let html = '';
        nuggets.forEach(n => {
            if (n.evidence_list) html += renderEvidenceList(n.evidence_list);
        });
        return html;
    }

    // ★変更箇所：前後のダブルクォーテーションを削除★
    function renderEvidenceList(evList) {
        if (!evList || evList.length === 0) return '';
        
        return evList.map(ev => {
            const safeReview = ev.original_review.replace(/"/g, '&quot;');
            return `
                <li class="evidence-item">
                    ${ev.evaluation}
                    <div class="tooltip">
                        <strong>元レビュー:</strong><br>
                        ${safeReview}
                    </div>
                </li>
            `;
        }).join('');
    }

    window.toggle = function(id) {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('show');
    };

</script>
</body>
</html>
